<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus 1: Profil Card Sederhana</title>
    <style>
        /* TUGAS:
           1. Berikan kontener lebar 300px, padding 24px, border-radius 12px, dan box-shadow.
           2. Buat avatar menjadi bulat dengan border-radius 50%.
           3. Ganti warna background tombol, hapus border, dan tambahkan efek hover (transform/cursor).
        */
        
        .kontener {  width: 300px;
            padding: 24px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.1);
            text-align: center;
            
        }
        
        .avatar { width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            
        }

        button { background-color: #2965F1;
            color: #FFFFFF;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            
        }
        
        button:hover {  background-color: #1d4ed8;
            cursor: pointer;
            transform: translateY(-2px);
            transition: all 0.2s ease;
            
        }
    </style>
</head>
<body>
    <div class="kontener">
        <img src="profilaul.jpeg" alt="Avatar" class="avatar">
        <h2>Aulia puspita dewi</h2>
        <p>Frontend Developer | Tech Educator</p>
        <p>Passionate about clean code and modern UI/UX.</p>
        <button>Follow Aulia puspita dewi </button>
    </div>
</body>
</html>
