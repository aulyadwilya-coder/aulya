    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>02 - Form Login</title>

    <style>
        /* 1. Body di tengah layar */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        /* 2. Container login */
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        /* Judul */
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 3. Label */
        label {
            display: block;
            margin-bottom: 5px;
        }

        /* 4. Input */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* 5. Focus pada input */
        input:focus {
            border-color: #007bff;
            outline: none;
        }

        /* 6. Tombol submit */
        input[type="submit"] {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        /* 7. Hover tombol */
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Masuk ke Akun</h2>

        <form>
            <label for="username">Username</label>
            <input type="text" id="username" name="username">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">

            <input type="submit" value="Login">
        </form>

    </div>

</body>
</html>

    INSTRUKSI PENGERJAAN (TO-DO LIST):

    2. Berikan gaya pada kontainer ".login-container" (background putih, padding 30px, border-radius 8px, box-shadow).
    3. Atur label agar display-nya 'block' dan memiliki margin-bottom agar input ada di bawahnya.
    4. Atur input text dan password agar lebarnya 100% (width: 100%), padding 10px, margin-bottom 15px, border 1px solid #ccc, dan border-radius 5px.
    5. Tambahkan pseudo-class :focus pada input (ubah warna border menjadi biru dan outline: none saat diklik).

    7. Tambahkan efek hover pada tombol submit.
