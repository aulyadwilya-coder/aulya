<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>10 - Galeri Gambar - Sebelum</title>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Ubah class ".gallery" menjadi CSS Grid (grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))) dan beri gap.
    2. Pada elemen pembungkus gambar (.img-box), berikan properti aspect-ratio: 1/1 (agar selalu kotak), overflow: hidden, dan border-radius.
    3. Pada <img>, atur width: 100%, height: 100%, object-fit: cover agar gambar memenuhi kotak tanpa distorsi.
    4. Tambahkan filter: grayscale(100%) pada gambar agar berwarna hitam putih secara default, dan tambahkan efek transition.
    5. Saat di hover (img:hover), ubah filter menjadi grayscale(0) dan gunakan transform: scale(1.1) agar gambar membesar sedikit saat ditunjuk.
    -->
    
    
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Aesthetic Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
            min-height: 100vh;
            padding: 50px 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 35px;
            color: #333;
            letter-spacing: 2px;
        }

        .title p {
            color: #888;
            margin-top: 8px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 22px;
            max-width: 1100px;
            margin: auto;
        }

        .img-box {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            background-color: white;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: all 0.5s ease;
        }

        .img-box img:hover {
            filter: grayscale(0);
            transform: scale(1.1);
        }

        .img-box:hover {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="title">
        <h1>My Gallery</h1>
        <p>Moments that tell a story ✨</p>
    </div>

    <div class="gallery">

        <div class="img-box">
            <img src="https://picsum.photos/id/1015/600/600" alt="Gallery 1">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/1016/600/600" alt="Gallery 2">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/1025/600/600" alt="Gallery 3">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/1035/600/600" alt="Gallery 4">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/1043/600/600" alt="Gallery 5">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/106/600/600" alt="Gallery 6">
        </div>

    </div>

</body>
</html>
